{% extends "shop/base.html" %} {% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="card-title mb-4 text-center">Ajouter un plat</h2>

          <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
              {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
            </div>
            {% endfor %}
            <div class="d-grid gap-2">
              <button type="submit" name="action" value="continuer" class="btn btn-success">Ajouter et en créer un autre</button>
              <button type="submit" name="action" value="terminer" class="btn btn-outline-secondary">Ajouter et terminer</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
