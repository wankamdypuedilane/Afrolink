{% extends "shop/base.html" %}

{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-3">Laisser un avis sur « {{ plat.title }} »</h3>
          <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
              {{ field }}
              {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-success">Publier mon avis</button>
            <a href="{% url 'detail' plat.id %}" class="btn btn-secondary">Annuler</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
